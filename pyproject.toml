[project]
name = "ellict"
version = "0.1.0"
description = "Turn an application into installable agent skills from one command."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellict" }]

[project.scripts]
ellict = "ellict.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
